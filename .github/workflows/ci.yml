name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRADING_MODE: paper
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:ci_only_password@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          pip install -r requirements.txt
      - name: Secret scan
        working-directory: backend
        run: python -m scripts.secret_scan
      - name: Tests (SQLite + real PostgreSQL)
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered
