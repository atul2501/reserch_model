[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Test categories (see TESTING.md). Applied automatically by tests/conftest.py::pytest_collection_modifyitems.
markers =
    unit: deterministic; no network, credentials, Ollama, Hyperliquid, AWS or external server (auto-applied default)
    integration: needs a LOCAL service/tool - real PostgreSQL (TEST_POSTGRES_ADMIN_URL) or Node.js; skips cleanly when absent
    external: needs internet and/or real credentials (Ollama, Hyperliquid, AWS); never part of the default run
    performance: wall-clock / benchmark assertions; machine-dependent; opt-in with -m performance
    shadow: PRETRADE_MODE=shadow and pre-trade architecture tests (deterministic; part of the default run)
# The default run is the deterministic suite (unit + integration-that-skips-when-absent + shadow).
addopts = -m "not external and not performance"
